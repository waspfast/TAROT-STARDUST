name = "stardustworker"
main = "worker.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "BOOKINGS"
id = "70a81faafbc14e7e9ac2010b0cda4d92"

# --- Cupo atomico (D1) -----------------------------------------------
# Activado: el worker usa D1 (SQLite) para reservar sin Durable Objects.
# Si quitas el binding "DB", cae al respaldo KV (NO atomico).
[[d1_databases]]
binding = "DB"
database_name = "stardust-db"
database_id = "55f697fe-dd97-4e6e-ad81-def11dde96f3"
